name: 'Build and push docker image'
description: 'Build the docker image and push it to the registry'

inputs:
  registry:
    description: "Docker registry"
    default: "ghcr.io"
  username:
    description: "Registry username, required if push is true"
    required: false
  password:
    description: "Registry password, required if push is true"
    required: false
  docker-image:
    description: "Docker image name"
    required: true
  docker-tag:
    description: "Docker image tag. Set either docker-tag or docker-tags."
    required: false
  docker-tags:
    description: "Docker image tags (multi-line string, one tag per line). Set either docker-tag or docker-tags."
    required: false
  push:
    description: "Push the image to the registry. If false, the image is only built."
    default: "true"
  load:
    description: "Load the image into the local Docker daemon, e.g. to test it in a later step. Works only for a single platform."
    default: "false"
  working-directory:
    description: 'The working directory'
    default: '.'
  dockerfile:
    description: "Path to the Dockerfile. (default {working-directory}/Dockerfile)"
    default: "Dockerfile"
  build-args:
    description: "List of build-time variables"
    required: false
  platforms:
    description: "Target platforms for the build (comma-separated or multi-line string). Leave empty for default runner architecture."
    required: false

outputs:
  digest:
    description: "Image digest"
    value: ${{ steps.build.outputs.digest }}

runs:
  using: "composite"
  steps:
    - name: Resolve image tags
      id: tags
      shell: bash
      env:
        DOCKER_IMAGE: ${{ inputs.docker-image }}
        DOCKER_TAG: ${{ inputs.docker-tag }}
        DOCKER_TAGS: ${{ inputs.docker-tags }}
      run: |
        if [[ -n "$DOCKER_TAG" && -n "$DOCKER_TAGS" ]]; then
          echo "::error::Set either docker-tag or docker-tags, not both."
          exit 1
        fi
        if [[ -z "$DOCKER_TAG" && -z "$DOCKER_TAGS" ]]; then
          echo "::error::Set docker-tag or docker-tags."
          exit 1
        fi
        {
          echo "tags<<EOF"
          printf '%s\n' "$DOCKER_TAG" "$DOCKER_TAGS" | sed '/^[[:space:]]*$/d; s/^[[:space:]]*//; s/[[:space:]]*$//' | sed "s|^|$DOCKER_IMAGE:|"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Set up QEMU for multi-arch builds
      if: ${{ inputs.platforms != '' }}
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Docker Registry
      if: ${{ inputs.push == 'true' }}
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Build and push container image
      id: build
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.working-directory }}
        file: ${{ inputs.dockerfile }}
        push: ${{ inputs.push }}
        load: ${{ inputs.load }}
        tags: ${{ steps.tags.outputs.tags }}
        build-args: ${{ inputs.build-args }}
        platforms: ${{ inputs.platforms }}
